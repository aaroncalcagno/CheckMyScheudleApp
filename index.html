:root{--bg:#f3f5f7;--cd:#fff;--tx:#25303b;--mu:#5a6573;--bd:#dde3e9;--pr:#0877b8;--on:#fff;--cft:#b42323;--lk:var(--pr);--ok:#1e9e5a;--bad:#c53030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

function prt(){try{window.print()}catch(e){toast('Printing is not available here.')}}
function dataCard(){if(!isM(me()))return'';return bkCard()+`<div class="card"><h3 style="margin-top:0">Data</h3><p class=mu>Saved automatically in this browser only. Use a backup to move it.</p><div class=row><button onclick="saveFile('go-car-wash-backup.json',stateJSON(),'application/json')">Download backup</button><label style="margin:0;color:var(--tx);font-size:14px">Restore from backup <input type=file accept=".json,application/json" onchange="restoreFile(this.files[0])" style="display:inline-block;width:auto"></label><span class=sp></span><button class=bad onclick="resetAll()">Erase all data</button></div></div>`}
function restoreFile(f){if(!f)return;if(CLOUD)return toast("Restoring from a file isn't available with shared saving.");const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(!j.P||!j.S)throw 0;if(!(await ask('Replace everything with this backup?')))return;bkSnap('Before restoring a file',true);loadState(j);toast('Backup restored.');render()}catch(e){toast("That file isn't a valid backup.")}};r.readAsText(f)}
async function resetAll(){if(CLOUD){if(!(await ask('Sign out and clear this browser?')))return;try{localStorage.removeItem(DKEY)}catch(e){}return cOut()}if(!(await ask('Erase all data in this browser and start over? This cannot be undone.')))return;NOSAVE=true;clearTimeout(_sv);try{localStorage.removeItem(SKEY)}catch(e){}location.reload()}
const PROWS=[['sched','Add, edit, delete and publish shifts'],['notes','See and write manager notes on shifts'],['appr','Approve time off and availability (never their own)'],['act','See the Activity log'],['chatdel','Delete chat messages and cancel posted shifts'],['team','Add, edit or remove team members below their own clearance'],['mshift','Take manager-only shifts posted in chat']],
PFIX=[['View every location\'s schedule',[1,1,1]],['Request time off and availability changes',[1,1,1]],['Chat, My Shifts and own profile',[1,1,1]],['Change roles, clearances and passwords',[0,0,0]],['Labor goal, hours, advance notice, business name and color',[0,0,0]],['Add or edit locations and access codes',[0,0,0]],['Delete a location (not your own)',[0,0,0]],['Backup, restore or erase data',[0,0,0]]];
function setPerm(k,lv,on){const m=me();if(!isM(m)||(m.pos!='DM'&&L!=m.loc))return;const a=[...permOf(L)[k]];a[lv]=on?1:0;LL[L].perm={...(LL[L].perm||{}),[k]:a};render()}
function permCard(){const m=me();if(!isM(m))return'';const ok=m.pos=='DM'||L==m.loc,box=(c,d,h)=>`<td style="text-align:center"><input type=checkbox style="width:auto;margin:0" ${c?'checked':''} ${d?'disabled':''} ${h||''}>`,pm=permOf(L);
return`<div class="card"><h3 style="margin-top:0">Who can do what at ${esc(LOC[L])}</h3><p class=mu>Tick what each clearance level can do here. ${ok?'Saves right away.':'View only.'} Managers always have everything. Rename a level by editing its name.</p><div style="overflow-x:auto"><table class=pt2><tr><th>Action${[1,2,3,4].map(i=>`<th><input aria-label="Clearance name" title="${isM(me())?'Click to rename':''}" ${isM(me())?'':'disabled'} maxlength=24 value="${esc(CLN[i])}" onchange="setCln(${i},this.value)" style="width:100%;min-width:90px;box-sizing:border-box;font-weight:700;padding:4px 6px">`).join('')}</tr>${PROWS.map(([k,t])=>`<tr><td>${t}${[0,1,2].map(i=>box(pm[k][i],!ok,`onchange="setPerm('${k}',${i},this.checked)"`)).join('')}${box(1,1)}`).join('')}<tr><td colspan=5 style="background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)">Always the same</tr>${PFIX.map(([t,v])=>`<tr><td>${t}${v.map(x=>box(x,1)).join('')}${box(1,1)}`).join('')}</table></div></div>`}
if(CLOUD)cBoot();else if(CFGON)cNoLib();else{try{const raw=localStorage.getItem(SKEY);if(raw)loadState(JSON.parse(raw))}catch(e){}
if(U!=null&&matchMedia('(max-width:799px)').matches)tab='m';render()}setTimeout(()=>{try{checkRem()}catch(e){}},1500);

/* touch drag-and-drop: lets the existing drag handlers work with a finger */
(function(){let tdt=null;const mk=(t,dt)=>{const e=new Event(t,{bubbles:true,cancelable:true});Object.defineProperty(e,'dataTransfer',{value:dt});return e},
fire=(el,t)=>el&&el.dispatchEvent(mk(t,tdt.dt)),
end=()=>{if(!tdt)return;clearTimeout(tdt.timer);tdt.ghost&&tdt.ghost.remove();document.body.classList.remove('tdrag');if(tdt.on)fire(tdt.src,'dragend');tdt=null};
try{new DataTransfer()}catch(e){return}
const begin=()=>{if(!tdt)return;tdt.on=true;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}fire(tdt.src,'dragstart');const b=tdt.src.closest('.lr,tr,.nm')||tdt.src,r=b.getBoundingClientRect(),g=b.cloneNode(true);g.removeAttribute('id');g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${Math.min(r.width,innerWidth-16)}px;opacity:.88;pointer-events:none;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.3);background:var(--cd);border-radius:10px;margin:0`;document.body.appendChild(g);tdt.ghost=g;tdt.gx=tdt.x-r.left;tdt.gy=tdt.y-r.top;document.body.classList.add('tdrag')};
document.addEventListener('touchstart',e=>{end();if(e.touches.length!=1)return;const t=e.target,src=t.closest&&t.closest('[draggable="true"]');if(!src||t.closest('input,select,textarea,button,a'))return;const c=e.touches[0],grip=src.classList.contains('grip')||(src.tagName=='TR'&&t.closest('td')===src.querySelector('td'));tdt={src,x:c.clientX,y:c.clientY,on:false,dt:new DataTransfer(),ghost:null};if(grip)begin();else tdt.timer=setTimeout(begin,380)},{passive:true});
document.addEventListener('touchmove',e=>{if(!tdt)return;const c=e.touches[0];if(!tdt.on){if(Math.abs(c.clientX-tdt.x)>9||Math.abs(c.clientY-tdt.y)>9){clearTimeout(tdt.timer);tdt=null}return}
e.preventDefault();tdt.x=c.clientX;tdt.y=c.clientY;if(tdt.ghost){tdt.ghost.style.left=(c.clientX-tdt.gx)+'px';tdt.ghost.style.top=(c.clientY-tdt.gy)+'px'}
const el=document.elementFromPoint(c.clientX,c.clientY);if(el)fire(el,'dragover');if(c.clientY<90)scrollBy(0,-14);else if(c.clientY>innerHeight-110)scrollBy(0,14)},{passive:false});
document.addEventListener('touchend',e=>{if(!tdt)return;if(tdt.on){e.preventDefault();const el=document.elementFromPoint(tdt.x,tdt.y);if(el)fire(el,'drop')}end()});
document.addEventListener('touchcancel',end)})();
</script></body></html>
